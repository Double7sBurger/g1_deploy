[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-deploy"
version = "0.1.0"
description = "Run an Isaac Lab G1 locomotion policy on a real Unitree G1, or on MuJoCo over the same DDS"
readme = "README.md"
requires-python = ">=3.10"

# The robot-facing path deliberately needs nothing else: no simulator, no Isaac Lab, no GPU. The
# policy is a 208K-parameter MLP that runs in 0.016 ms on one CPU thread, 0.1% of the 20 ms control
# period, so a laptop or the G1's own computer is enough.
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "cyclonedds",
]

[project.optional-dependencies]
# unitree_sdk2py is not on PyPI; install it from source:
#   git clone https://github.com/unitreerobotics/unitree_sdk2_python && pip install -e unitree_sdk2_python
sim = ["mujoco>=3.1"]
video = ["opencv-python>=4.8"]

[project.scripts]
g1-policy-loop = "scripts.run_policy_loop:main"
g1-sim-loop = "scripts.run_sim_loop:main"

[tool.setuptools.packages.find]
include = ["g1_deploy*", "scripts*"]

[tool.setuptools.package-data]
g1_deploy = ["data/*.json"]

[tool.ruff]
line-length = 120
